<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>바로가기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --card:#ffffff;
    --card-line:rgba(0,0,0,0.06);
    --ink:#1b1b22;
    --ink-soft:#5a5a66;
    --accent:#2f6df0;
    --danger:#ff4d4f;
    --font:"Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font);overflow:hidden;position:relative;
    background:#ffffff;
  }
  /* horizon glow */
  .glow{position:fixed;left:0;right:0;bottom:14%;height:34%;z-index:1;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 100%,rgba(255,196,140,0.22),rgba(255,170,150,0.06) 45%,transparent 70%);}
  .haze{position:fixed;left:0;right:0;bottom:0;height:42%;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(120,120,160,0.18) 60%,rgba(20,20,32,0.4));}
  /* skyline */
  #city{position:fixed;left:0;right:0;bottom:0;width:100%;height:46%;z-index:2;pointer-events:none;display:block}
  /* stage */
  .stage{position:relative;z-index:5;min-height:100%;padding:18px 16px}

  .panel{
    width:100%;
    max-width:460px;
    background:transparent;
    border:none;
    border-radius:0;
    box-shadow:none;
    padding:0;
    opacity:0;transform:translateY(8px);
    animation:pop .45s ease forwards;
  }
  @keyframes pop{to{opacity:1;transform:translateY(0)}}
  .hint-bar{display:none;margin-top:14px;text-align:center;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}

  .top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 14px}
  .top .when{line-height:1.05}
  .top .time{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .top .time small{font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:3px}
  .top .date{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-top:3px}
  .editbtn{
    border:none;background:rgba(120,120,140,0.16);color:var(--ink);
    font-family:var(--font);font-size:12.5px;font-weight:700;
    padding:7px 13px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;
  }
  .editbtn:hover{background:rgba(120,120,140,0.26)}
  .editbtn.on{background:var(--accent);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
  .tile{
    position:relative;border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:6px 2px;border-radius:16px;font-family:var(--font);
    transition:background .18s;
  }
  .tile:hover{background:rgba(0,0,0,0.04)}
  .tile .badge-wrap{position:relative}
  .tile .icon{
    width:50px;height:50px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:#fff;box-shadow:0 4px 12px -4px rgba(20,18,40,.4),0 0 0 1px rgba(0,0,0,.04);
  }
  .tile .icon img{width:30px;height:30px;display:block}
  .tile .icon .letter{font-size:22px;font-weight:800;color:#fff}
  .tile .icon .emoji{font-size:27px;line-height:1}
  .tile .label{
    font-size:11px;font-weight:600;color:var(--ink);max-width:62px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* add tile */
  .tile.add .icon{background:#f4f5f7;border:1.5px dashed rgba(60,60,90,.28);box-shadow:none}
  .tile.add .icon svg{width:24px;height:24px;stroke:var(--ink-soft);stroke-width:2;fill:none;stroke-linecap:round}
  /* delete badge */
  .del{
    position:absolute;top:-5px;left:-5px;width:20px;height:20px;border-radius:50%;
    background:var(--danger);color:#fff;border:1.5px solid #fff;
    display:none;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;line-height:1;cursor:pointer;z-index:3;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .grid.editing .tile:not(.add) .del{display:flex}
  .grid.editing .tile:not(.add) .badge-wrap{animation:wiggle .32s infinite}
  .grid.editing .tile:not(.add):nth-child(even) .badge-wrap{animation-delay:-.16s}
  @keyframes wiggle{0%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}100%{transform:rotate(-1.6deg)}}
  /* drag to reorder (edit mode) */
  .grid.editing .tile:not(.add){touch-action:none;cursor:grab}
  .tile.drag-active{z-index:6;opacity:.95;transform:scale(1.14);transition:transform .12s}
  .tile.drag-active .badge-wrap{animation:none!important}
  .tile.drag-active .icon{box-shadow:0 10px 20px -6px rgba(20,18,40,.45)}
  .grid.editing .tile:not(.add):not(.drag-active){transition:transform .18s ease}

  /* modal */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(20,18,35,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .overlay.show{display:flex}
  .modal{
    width:min(90vw,320px);background:rgba(253,253,254,.94);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-radius:22px;padding:20px;border:1px solid rgba(255,255,255,.7);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
    transform:scale(.96);opacity:0;transition:.18s;
  }
  .overlay.show .modal{transform:scale(1);opacity:1}
  .modal h3{font-size:15px;color:var(--ink);margin-bottom:14px;font-weight:700}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  .field input{
    width:100%;font-family:var(--font);font-size:14px;color:var(--ink);
    padding:10px 12px;border:1px solid rgba(60,60,90,.2);border-radius:11px;
    background:#fff;outline:none;transition:border .15s,box-shadow .15s;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,240,.15)}
  .field textarea{
    width:100%;font-family:var(--font);font-size:12px;color:var(--ink);
    padding:10px 12px;border:1px solid rgba(60,60,90,.2);border-radius:11px;
    background:#fff;outline:none;resize:vertical;line-height:1.45;
  }
  .field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,240,.15)}
  .field .hint{font-size:10.5px;color:#9a9aa6;margin-top:4px}
  .io-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .io-btn{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--ink);background:rgba(120,120,140,.12);border:none;border-radius:999px;padding:6px 13px;cursor:pointer;transition:background .15s}
  .io-btn:hover{background:rgba(120,120,140,.24)}
  .row{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;font-family:var(--font);font-size:14px;font-weight:700;padding:11px;border-radius:12px;border:none;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#000}
  .btn.ghost{background:rgba(120,120,140,.14);color:var(--ink)}
  .btn.ghost:hover{background:rgba(120,120,140,.24)}

  @media (max-height:560px){.stage{padding-top:5vh}.top{padding-bottom:10px}}
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="top">
      <div class="when">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">·</div>
      </div>
      <button class="editbtn" id="editBtn">편집</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint-bar" id="hintBar">
      <div>탭하면 편집 · 끌면 이동 · − 삭제</div>
      <div class="io-row">
        <button class="io-btn" id="exportBtn">내보내기</button>
        <button class="io-btn" id="importBtn">가져오기</button>
      </div>
    </div>
  </div>
</div>

<!-- add modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">바로가기 추가</h3>
    <div class="field">
      <label>이름</label>
      <input id="inName" placeholder="예) 본사포털" maxlength="14" autocomplete="off">
    </div>
    <div class="field">
      <label>주소 (URL)</label>
      <input id="inUrl" placeholder="예) portal.kcc.co.kr" autocomplete="off">
      <div class="hint">https:// 는 자동으로 붙습니다</div>
    </div>
    <div class="field">
      <label>아이콘 이모지 (선택)</label>
      <input id="inEmoji" placeholder="비워두면 이름 앞글자로 표시" maxlength="4" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn ghost" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">추가</button>
    </div>
  </div>
</div>

<!-- backup / restore modal -->
<div class="overlay" id="ioOverlay">
  <div class="modal">
    <h3 id="ioTitle">백업</h3>
    <div class="field">
      <label id="ioLabel">코드</label>
      <textarea id="ioText" rows="6"></textarea>
    </div>
    <div class="row">
      <button class="btn ghost" id="ioCancel">닫기</button>
      <button class="btn primary" id="ioAction">복사</button>
    </div>
  </div>
</div>

<script>
/* ---------- defaults (지점장님 자주 쓰는 사이트) ---------- */
const DEFAULT_LINKS = [
  {name:'KCC메일', url:'https://kcc.daouoffice.com/gw/app/mail'},
  {name:'CRM', url:'https://www.crm4u.co.kr/kccautomobile'},
  {name:'계출', url:'https://docs.google.com/spreadsheets/d/1UzlmRSZBmiOHCX0KlbjlZiJJcZro7UgoUG_euwPqLsM/edit?gid=1759732131#gid=1759732131'},
  {name:'CXP', url:'https://cxp.my.site.com/CXP/s/'},
  {name:'NPS', url:'https://connect.jlrsso.com/adfs/ls/'},
  {name:'지점장', url:'https://docs.google.com/spreadsheets/d/1DfWxR21mPnIMEWmyRzTRexD-Hl1VI-2bFsmolO4mVWE/edit?gid=461001102#gid=461001102'},
  {name:'KPI', url:'https://gtpark7777777-design.github.io/kcc-kpi/?v=4'},
  {name:'Gmail', url:'https://mail.google.com'},
  {name:'상담툴', url:'https://kcc-ilsan.kr/tool/'},
  {name:'로스트리드', url:'https://docs.google.com/spreadsheets/d/1CWjWAW4HZQhD0IJhrsIkJ9t6eQfAbrUBAmshdxUn_0E/edit?gid=1546333716#gid=1546333716'},
  {name:'재고표', url:'https://docs.google.com/spreadsheets/d/1DDfe6K9WttZkisBP4CqahiQDd1gT1SkTThp4rM8fGc0/edit?gid=1270283038#gid=1270283038'},
  {name:'리드배정', url:'https://cxp.my.site.com/CXP/s/login/?language=en_US&ec=302&startURL=%2FCXP%2Fs%2Flead%2FLead%2FDefault%3FLead-filterId%3DX001_All_Open_Leads_SG'},
];
const KEY='kcc_ilsan_links_v2';
const PALETTE=['#2f6df0','#e2725b','#3cb371','#9b59b6','#e0a020','#16a8a6','#d4566a','#5566c0'];

let links=load();
let editing=false;

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return DEFAULT_LINKS.slice();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(links));}catch(e){/* 미리보기에선 세션 동안만 유지 */}
}
function hostOf(u){try{return new URL(u).hostname;}catch(e){return '';}}
function normalizeUrl(u){
  u=(u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  return u;
}
/* 이름 앞글자 + 이름 기반 고정 색상 (순서 바뀌어도 색 유지) */
function firstChar(s){const a=Array.from((s||'?').trim());return (a[0]||'?').toUpperCase();}
function colorFor(s){s=s||'';let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PALETTE[h%PALETTE.length];}
/* 주소를 보고 어울리는 아이콘(이모지) 자동 지정 */
function resolveEmoji(u){
  u=(u||'').toLowerCase();
  const h=hostOf(u).toLowerCase();
  if(u.includes('1uzlmrszbmiohcx0klbjlzijjczro7ugoug_euwpqlsm')) return '📋'; // 가망시트
  if(u.includes('1bjqstc3yt5s3qwx2pz-wq4ligon0qpjpotklgg30ctq')) return '🧮'; // 손익SR
  if(h.includes('cxp.my.site')) return u.includes('/report/') ? '📊' : '☁️';
  if(h.includes('mail.google')) return '✉️';
  if(h.includes('calendar.google')) return '📅';
  if(h.includes('drive.google')) return '📁';
  if(h.includes('docs.google')) return '📄';
  if(h.includes('notion.')) return '📝';
  if(h.includes('kcc-ilsan-cards.pages.dev')) return '🪪';
  if(h.includes('youtube.')||h.includes('youtu.be')) return '▶️';
  if(h.includes('kakao')) return '💬';
  if(h.includes('naver.')) return '🔎';
  if(h.includes('github.')) return '💻';
  return '';
}

/* ---------- render ---------- */
const grid=document.getElementById('grid');
function render(){
  grid.innerHTML='';
  grid.classList.toggle('editing',editing);
  links.forEach((lk,i)=>grid.appendChild(makeTile(lk,i)));
  grid.appendChild(makeAddTile());
}
function makeTile(lk,i){
  const t=document.createElement('button');
  t.className='tile';
  t.dataset.idx=i;
  const bw=document.createElement('div');bw.className='badge-wrap';

  const ic=document.createElement('div');ic.className='icon';
  if(lk.emoji){
    const e=document.createElement('span');e.className='emoji';e.textContent=lk.emoji;ic.appendChild(e);
  }else{
    const L=document.createElement('span');L.className='letter';
    L.textContent=firstChar(lk.name||lk.url);
    ic.style.background=colorFor(lk.name||lk.url);
    ic.appendChild(L);
  }
  bw.appendChild(ic);

  const del=document.createElement('span');del.className='del';del.textContent='−';
  del.onclick=(ev)=>{ev.stopPropagation();links.splice(i,1);save();render();};
  bw.appendChild(del);

  const lbl=document.createElement('div');lbl.className='label';lbl.textContent=lk.name||hostOf(lk.url);

  t.appendChild(bw);t.appendChild(lbl);
  t.onclick=()=>{ if(editing) return; window.open(lk.url,'_blank','noopener'); };
  t.addEventListener('pointerdown',(e)=>startDrag(e,t));
  return t;
}
function makeAddTile(){
  const t=document.createElement('button');t.className='tile add';
  const ic=document.createElement('div');ic.className='icon';
  ic.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  const lbl=document.createElement('div');lbl.className='label';lbl.textContent='추가';
  lbl.style.color='var(--ink-soft)';
  t.appendChild(ic);t.appendChild(lbl);
  t.onclick=openModal;
  return t;
}

/* ---------- edit toggle ---------- */
const editBtn=document.getElementById('editBtn');
const hintBar=document.getElementById('hintBar');
editBtn.onclick=()=>{
  editing=!editing;
  editBtn.textContent=editing?'완료':'편집';
  editBtn.classList.toggle('on',editing);
  hintBar.style.display=editing?'block':'none';
  render();
};

/* ---------- drag to reorder (마우스+터치) ---------- */
let dCand=null,dId=null,dx0=0,dy0=0,dragging=false,dEl=null;
function startDrag(e,tile){
  if(!editing) return;
  if(e.target.closest('.del')) return;
  dCand=tile;dId=e.pointerId;dx0=e.clientX;dy0=e.clientY;dragging=false;
}
function tileUnder(x,y){
  const ts=grid.querySelectorAll('.tile:not(.add)');
  for(const t of ts){
    if(t===dEl) continue;
    const r=t.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return t;
  }
  return null;
}
document.addEventListener('pointermove',(e)=>{
  if(!dCand) return;
  if(!dragging){
    if(Math.abs(e.clientX-dx0)+Math.abs(e.clientY-dy0)<8) return;
    dragging=true;dEl=dCand;
    try{dEl.setPointerCapture(dId);}catch(_){}
    dEl.classList.add('drag-active');
  }
  e.preventDefault();
  const over=tileUnder(e.clientX,e.clientY);
  if(over&&over!==dEl){
    const r=over.getBoundingClientRect();
    if(e.clientX>r.left+r.width/2) over.after(dEl); else over.before(dEl);
  }
},{passive:false});
document.addEventListener('pointerup',(e)=>{
  if(!dCand) return;
  if(dragging){
    try{dEl.releasePointerCapture(dId);}catch(_){}
    dEl.classList.remove('drag-active');
    const order=[...grid.querySelectorAll('.tile:not(.add)')].map(t=>+t.dataset.idx);
    links=order.map(i=>links[i]);
    save();render();
  } else {
    openEdit(+dCand.dataset.idx);
  }
  dCand=null;dragging=false;dEl=null;dId=null;
});

/* ---------- modal ---------- */
const overlay=document.getElementById('overlay');
const inName=document.getElementById('inName');
const inUrl=document.getElementById('inUrl');
const inEmoji=document.getElementById('inEmoji');
const modalTitle=document.getElementById('modalTitle');
const saveBtn=document.getElementById('saveBtn');
let editIndex=null;
function openModal(){
  editIndex=null;
  inName.value='';inUrl.value='';inEmoji.value='';
  modalTitle.textContent='바로가기 추가';saveBtn.textContent='추가';
  overlay.classList.add('show');setTimeout(()=>inName.focus(),80);
}
function openEdit(i){
  const lk=links[i]; if(!lk) return;
  editIndex=i;
  inName.value=lk.name||'';inUrl.value=lk.url||'';inEmoji.value=lk.emoji||'';
  modalTitle.textContent='바로가기 편집';saveBtn.textContent='저장';
  overlay.classList.add('show');setTimeout(()=>inName.focus(),80);
}
function closeModal(){overlay.classList.remove('show');editIndex=null;}
document.getElementById('cancelBtn').onclick=closeModal;
overlay.onclick=(e)=>{if(e.target===overlay)closeModal();};
saveBtn.onclick=()=>{
  const name=inName.value.trim();
  const url=normalizeUrl(inUrl.value);
  if(!url){inUrl.focus();return;}
  const item={name:name||hostOf(url),url:url,emoji:inEmoji.value.trim()||undefined};
  if(editIndex!==null && links[editIndex]) links[editIndex]=item;
  else links.push(item);
  save();closeModal();render();
};
[inUrl,inEmoji,inName].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')saveBtn.click();}));

/* ---------- backup / restore ---------- */
const ioOverlay=document.getElementById('ioOverlay');
const ioTitle=document.getElementById('ioTitle');
const ioLabel=document.getElementById('ioLabel');
const ioText=document.getElementById('ioText');
const ioAction=document.getElementById('ioAction');
let ioMode='export';
document.getElementById('exportBtn').onclick=()=>{
  ioMode='export';
  ioTitle.textContent='내보내기 (백업)';
  ioLabel.textContent='아래 코드를 전체 복사해 두세요. 다른 브라우저의 "가져오기"에 붙여넣으면 그대로 복원됩니다.';
  ioLabel.style.color='';
  ioText.value=JSON.stringify(links);
  ioText.readOnly=true;
  ioAction.textContent='클립보드 복사';
  ioOverlay.classList.add('show');
  setTimeout(()=>{ioText.focus();ioText.select();},80);
};
document.getElementById('importBtn').onclick=()=>{
  ioMode='import';
  ioTitle.textContent='가져오기 (복원)';
  ioLabel.textContent='백업한 코드를 붙여넣고 불러오기를 누르세요. (현재 목록을 덮어씁니다)';
  ioLabel.style.color='';
  ioText.value='';
  ioText.readOnly=false;
  ioAction.textContent='불러오기';
  ioOverlay.classList.add('show');
  setTimeout(()=>ioText.focus(),80);
};
document.getElementById('ioCancel').onclick=()=>ioOverlay.classList.remove('show');
ioOverlay.onclick=(e)=>{if(e.target===ioOverlay)ioOverlay.classList.remove('show');};
ioAction.onclick=async ()=>{
  if(ioMode==='export'){
    let ok=false;
    try{await navigator.clipboard.writeText(ioText.value);ok=true;}catch(_){}
    if(!ok){try{ioText.select();document.execCommand('copy');ok=true;}catch(_){}}
    ioAction.textContent=ok?'복사됨 ✓':'직접 복사하세요';
    setTimeout(()=>{ioAction.textContent='클립보드 복사';},1600);
  }else{
    try{
      const arr=JSON.parse(ioText.value.trim());
      if(!Array.isArray(arr)) throw 0;
      links=arr.filter(x=>x&&x.url).map(x=>({name:String(x.name||''),url:String(x.url),emoji:x.emoji?String(x.emoji):undefined}));
      save();render();
      ioOverlay.classList.remove('show');
    }catch(_){
      ioLabel.textContent='⚠️ 코드 형식이 올바르지 않습니다. 전체를 다시 붙여넣어 주세요.';
      ioLabel.style.color='var(--danger)';
    }
  }
};

/* ---------- clock ---------- */
const DAY=['일','월','화','수','목','금','토'];
function tick(){
  const n=new Date();let h=n.getHours();const m=String(n.getMinutes()).padStart(2,'0');
  const ap=h<12?'오전':'오후';let hh=h%12;if(hh===0)hh=12;
  document.getElementById('time').innerHTML=hh+':'+m+' <small>'+ap+'</small>';
  document.getElementById('date').textContent=(n.getMonth()+1)+'월 '+n.getDate()+'일 ('+DAY[n.getDay()]+')';
}
tick();setInterval(tick,1000);

/* ---------- skyline removed (white theme) ---------- */

render();
</script>
